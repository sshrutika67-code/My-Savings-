<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8dce8">
  <meta name="description" content="A simple 100-day cash savings tracker.">
  <title>Pink 100</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <div class="eyebrow">MY LITTLE SAVINGS JOURNEY</div>
      <h1>Pink 100 <span>♡</span></h1>
      <p class="subtitle">One little step at a time.</p>
    </header>

    <section class="summary" aria-label="Savings totals">
      <div class="total-card">
        <div class="label">TOTAL SAVED</div>
        <div class="amount" id="allTotal">₹0</div>
        <div class="small" id="daysCount">0 of 100 days saved</div>
      </div>
      <div class="year-card">
        <div class="label">SAVED THIS YEAR</div>
        <div class="year-amount" id="yearTotal">₹0</div>
        <div class="small" id="yearLabel"></div>
      </div>
    </section>

    <section class="progress-wrap">
      <div class="progress-line"><span id="progressBar"></span></div>
      <div class="progress-caption" id="progressText">0% completed</div>
    </section>

    <section class="days-section">
      <div class="section-heading">
        <h2>My 100 days</h2>
        <span>Tap a day to add cash</span>
      </div>
      <div class="grid" id="daysGrid" aria-label="100 savings days"></div>
    </section>

    <footer>Your savings are stored on this device.</footer>
  </main>

  <dialog id="entryDialog">
    <form method="dialog" id="entryForm">
      <div class="dialog-top">
        <div>
          <div class="eyebrow">YOUR SAVINGS</div>
          <h2 id="dialogTitle">Day 1</h2>
        </div>
        <button class="close" type="button" id="closeDialog" aria-label="Close">×</button>
      </div>
      <label for="amountInput">Amount saved (₹)</label>
      <input id="amountInput" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Enter amount" autocomplete="off">
      <p class="hint">Leave it empty or enter 0 to keep this day unmarked.</p>
      <div class="dialog-actions">
        <button class="delete-btn" type="button" id="clearEntry">Clear</button>
        <button class="save-btn" type="submit">Save amount</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
